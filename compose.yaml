services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: exercise_service
      POSTGRES_USER: exercise_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exercise_service_pw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - exercise-service-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exercise_service -d exercise_service"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  exercise-service-postgres-data:
