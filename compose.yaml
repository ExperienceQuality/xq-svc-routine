services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: routine_service
      POSTGRES_USER: routine_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routine_service_pw}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - routine-service-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routine_service -d routine_service"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  routine-service-postgres-data:
