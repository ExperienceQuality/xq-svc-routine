plugins {
    id 'com.xq.jvm-test-kit.service-plugin' version '3.0.3'
}

group = 'com.xq'
version = '0.0.1-SNAPSHOT'
description = 'Routine service'

repositories {
    mavenCentral()
    maven {
        name = 'GitHubPackages'
        url = uri('https://maven.pkg.github.com/ExperienceQuality/jvm-test-kit')
        credentials {
            username = providers.environmentVariable('GITHUB_ACTOR').orNull
            password = providers.environmentVariable('GITHUB_TOKEN').orNull
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    e2eImplementation 'org.junit.jupiter:junit-jupiter-api'
    e2eImplementation 'org.junit.platform:junit-platform-suite'
    e2eImplementation 'io.cucumber:cucumber-junit-platform-engine:8.0.2'
    e2eImplementation 'com.xq:jvm-test-kit:3.0.3'
    e2eRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    e2eRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jvmTestKitService {
    artifactName = 'routine-service.jar'
    healthUrl = 'http://127.0.0.1:18090/livez'
    startupTimeout = java.time.Duration.ofSeconds(120)
    environment = [
        PORT: '18090',
        SPRING_DATASOURCE_URL: 'jdbc:postgresql://127.0.0.1:55432/routine_service',
        SPRING_DATASOURCE_USERNAME: 'routine_service',
        SPRING_DATASOURCE_PASSWORD: 'routine_service_pw',
        EXERCISE_SERVICE_BASE_URL: 'http://127.0.0.1:18091'
    ]
    cucumberPackage = 'test.steps'
    cucumberGlue = ['test.steps']
}

def e2eCompose = file('compose.yaml')

tasks.register('startPostgres') {
    group = 'verification'
    description = 'Starts the disposable PostgreSQL database for E2E tests.'
    doLast {
        exec {
            commandLine 'docker', 'compose', '-f', e2eCompose.absolutePath, 'down', '-v', '--remove-orphans'
        }
        exec {
            commandLine 'docker', 'compose', '-f', e2eCompose.absolutePath, 'up', '-d', '--wait'
        }
    }
}

tasks.register('stopPostgres') {
    group = 'verification'
    description = 'Stops and removes the disposable PostgreSQL database.'
    doLast {
        exec {
            commandLine 'docker', 'compose', '-f', e2eCompose.absolutePath, 'down', '-v', '--remove-orphans'
        }
    }
}

tasks.named('startE2eService') {
    dependsOn startPostgres
}

tasks.named('stopE2eService') {
    finalizedBy stopPostgres
}

tasks.named('e2eTest') {
    dependsOn startE2eService
    finalizedBy stopE2eService
    environment 'XQORB_BASE_URI', 'http://127.0.0.1:18090'
    systemProperty 'xqorb.base-uri', 'http://127.0.0.1:18090'
    environment 'XQ_STUB_ENABLED', 'true'
    environment 'XQ_STUB_HOST', '127.0.0.1'
    environment 'XQ_STUB_PORT', '18091'
}

tasks.named('cucumberE2eTest') {
    dependsOn startE2eService
    finalizedBy stopE2eService
    environment 'XQORB_BASE_URI', 'http://127.0.0.1:18090'
    systemProperty 'xqorb.base-uri', 'http://127.0.0.1:18090'
    environment 'XQ_STUB_ENABLED', 'true'
    environment 'XQ_STUB_HOST', '127.0.0.1'
    environment 'XQ_STUB_PORT', '18091'
}
