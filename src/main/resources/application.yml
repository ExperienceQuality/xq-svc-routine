spring:
  application:
    name: exercise-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/exercise_service}
    username: ${SPRING_DATASOURCE_USERNAME:exercise_service}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:exercise_service_pw}}
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-and-stop
  flyway:
    clean-disabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    validate-on-migrate: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info
