# hub-stage: deploy
name: Deploy

on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Render image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ghcr.io/experiencequality/xq-svc-exercice:sha-${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          encoded_image=$(jq -rn --arg image "$IMAGE" '$image | @uri')
          curl --fail --silent --show-error --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&imgURL=${encoded_image}"
