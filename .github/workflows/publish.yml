# hub-stage: publish
name: Publish

on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GHCR image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build image
        env:
          IMAGE: ghcr.io/experiencequality/xq-svc-exercice
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag "$IMAGE:sha-$IMAGE_SHA" \
            --tag "$IMAGE:latest" \
            --push \
            .
